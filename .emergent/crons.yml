crons:
  - name: approval-sla
    description: "Daily 09:00 UTC reminder to approvers with PR/PO/Budget waiting >48h"
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/approval-sla-alerts"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: fetch-fx-rates
    description: "Daily 06:00 UTC pull FX rates USD/SGD/JPY -> IDR (BI JISDOR proxy)"
    cron: "0 6 * * *"
    endpoint: "{{BASE_URL}}/api/cron/fetch-fx-rates"
    method: GET
    enabled: true
  - name: notification-digest
    description: "Daily 07:00 UTC email digest of last-24h notifications for users with realtime email OFF"
    cron: "0 7 * * *"
    endpoint: "{{BASE_URL}}/api/cron/notification-digest"
    method: GET
    enabled: true
  - name: tender-draft-reminders
    description: "Hourly reminder to vendors with draft tender bids expiring in next 12-36h"
    cron: "0 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/tender-draft-reminders"
    method: GET
    enabled: true
  - name: sealed-auto-reveal
    description: "Every 5 min: auto-reveal sealed tenders whose deadline has passed"
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/sealed-auto-reveal"
    method: GET
    enabled: true
  - name: overdue-invoice-reminder
    description: "Nightly 08:00 UTC: email finance the list of overdue outstanding invoices"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/overdue-invoice-reminder"
    method: GET
    enabled: true
